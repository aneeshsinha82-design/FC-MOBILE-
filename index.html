<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FC MOBILE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>FC MOBILE</h1>
<p>League Standings</p>
</header>

<section class="cards">
<div class="card"><h3>Teams</h3><b>8</b></div>
<div class="card"><h3>Win</h3><b>3 pts</b></div>
<div class="card"><h3>Draw</h3><b>1 pt</b></div>
</section>

<h2>Standings</h2>

<table>
<thead>
<tr>
<th>Pos</th>
<th>Team</th>
<th>P</th>
<th>W</th>
<th>D</th>
<th>L</th>
<th>GF</th>
<th>GA</th>
<th>GD</th>
<th>Pts</th>
</tr>
</thead>

<tbody id="tb"></tbody>

</table>

<footer>Only repository owner can update data.</footer>

<script>
fetch('data.json')
.then(r => r.json())
.then(teams => {

teams.sort((a,b)=>
b.pts-a.pts ||
b.gd-a.gd ||
b.gf-a.gf ||
a.team.localeCompare(b.team)
);

const tb=document.getElementById('tb');

teams.forEach((t,i)=>{
tb.innerHTML += `
<tr class="${i<1?'top':''}">
<td>${i+1}</td>
<td>${t.team}</td>
<td>${t.p}</td>
<td>${t.w}</td>
<td>${t.d}</td>
<td>${t.l}</td>
<td>${t.gf}</td>
<td>${t.ga}</td>
<td>${t.gd}</td>
<td>${t.pts}</td>
</tr>`;
});

});
</script>

</body>
</html>
