<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FC MOBILE — Home</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030806;font-family:Arial,Helvetica,sans-serif;color:white}
#scene{position:fixed;inset:0;z-index:0}.shade{position:fixed;inset:0;z-index:1;background:radial-gradient(circle at 50% 43%,transparent 0 18%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.76) 100%);pointer-events:none}
header{position:fixed;z-index:3;top:0;left:0;width:100%;padding:26px clamp(20px,5vw,72px);display:flex;justify-content:space-between;align-items:center}
.brand{font-size:clamp(20px,2.1vw,34px);font-weight:900;font-style:italic;letter-spacing:-1px}.brand b{color:#21e85e}.tag{font-size:10px;letter-spacing:.28em;color:#a8b6ae;margin-top:4px}
.status{font-size:11px;letter-spacing:.15em;color:#dce9e0;border:1px solid rgba(42,237,105,.35);padding:9px 14px;border-radius:999px;background:rgba(4,20,10,.38)}
.hero{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 20px 40px;pointer-events:none}
.kicker{font-size:11px;letter-spacing:.42em;color:#58f58a;margin-bottom:15px;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(46px,9vw,130px);line-height:.88;letter-spacing:-.06em;font-style:italic;text-shadow:0 0 35px rgba(37,241,99,.18)}.hero h1 span{color:#25e965}
.hero p{margin:20px auto 28px;max-width:560px;color:#d0d8d3;font-size:clamp(14px,1.4vw,18px);line-height:1.55}
.cta{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.65);background:#20dc5a;color:#031109;padding:17px 42px;border-radius:12px;font-size:15px;font-weight:900;letter-spacing:.15em;box-shadow:0 0 35px rgba(29,230,88,.35);transition:.25s}.cta:hover{transform:translateY(-3px) scale(1.03);background:#53ff83}.hint{margin-top:17px;font-size:10px;letter-spacing:.2em;color:#94a39a;text-transform:uppercase}
footer{position:fixed;z-index:3;bottom:20px;left:0;width:100%;padding:0 clamp(20px,5vw,72px);display:flex;justify-content:space-between;color:#78857d;font-size:10px;letter-spacing:.12em}
@media(max-width:600px){header{padding:20px}.status{display:none}.hero{padding-top:60px}.hero p{max-width:330px}.cta{padding:15px 28px}footer{padding:0 20px}.footer-right{display:none}}
</style>
</head>
<body>
<div id="scene"></div><div class="shade"></div>
<header><div><div class="brand"><b>FC</b> MOBILE</div><div class="tag">FAN STANDINGS HUB</div></div><div class="status">● LIVE SEASON 2026–27</div></header>
<main class="hero">
<div class="kicker">Enter the arena</div>
<h1>THE <span>GAME</span><br>STARTS HERE.</h1>
<p>Explore the season table inside a live 3D football arena. Move your mouse to shift the camera.</p>
<button class="cta" id="enter">VIEW STANDINGS →</button>
<div class="hint">Interactive 3D experience</div>
</main>
<footer><div>© 2026 FC MOBILE FAN PROJECT</div><div class="footer-right">MOVE • EXPLORE • COMPETE</div></footer>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
const host=document.getElementById('scene'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
camera.position.set(0,2.2,10);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
scene.fog=new THREE.FogExp2(0x030806,.075);
const ambient=new THREE.HemisphereLight(0x7cff9c,0x031006,1.5);scene.add(ambient);
const key=new THREE.PointLight(0x4cff82,80,30,2);key.position.set(0,5,4);scene.add(key);
const rim=new THREE.PointLight(0xffffff,55,22,2);rim.position.set(-6,4,2);scene.add(rim);
const rim2=new THREE.PointLight(0x31ff76,40,20,2);rim2.position.set(6,3,-1);scene.add(rim2);
// pitch
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(34,20),new THREE.MeshStandardMaterial({color:0x063d20,roughness:.88,metalness:.05}));pitch.rotation.x=-Math.PI/2;pitch.position.y=-2.05;scene.add(pitch);
const lineMat=new THREE.MeshBasicMaterial({color:0x2a9d55,transparent:true,opacity:.55});
const line=new THREE.Mesh(new THREE.RingGeometry(3.5,3.54,64),lineMat);line.rotation.x=-Math.PI/2;line.position.y=-2.03;scene.add(line);
// stadium bowl
for(let i=0;i<4;i++){const torus=new THREE.Mesh(new THREE.TorusGeometry(10+i*1.1,.28,12,80,Math.PI*1.55),new THREE.MeshStandardMaterial({color:0x0a1811,metalness:.7,roughness:.35,emissive:0x06120b}));torus.rotation.x=Math.PI/2;torus.position.y=1.3+i*.65;torus.rotation.z=.78;scene.add(torus)}
// floodlights
for(let side of[-1,1])for(let i=0;i<7;i++){const bulb=new THREE.PointLight(0xeafff1,8,8,2);bulb.position.set(side*(5+i*.72),3.8,-2+i*.18);scene.add(bulb);const dot=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));dot.position.copy(bulb.position);scene.add(dot)}
// football group
const ball=new THREE.Group();ball.position.y=.1;scene.add(ball);
const sphere=new THREE.Mesh(new THREE.SphereGeometry(1.22,48,32),new THREE.MeshStandardMaterial({color:0xf2f4ef,roughness:.42,metalness:.05}));ball.add(sphere);
const patchMat=new THREE.MeshStandardMaterial({color:0x07100b,roughness:.55,metalness:.12});
for(let i=0;i<10;i++){const a=i*Math.PI*2/10;const patch=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.025,5),patchMat);patch.rotation.set(Math.PI/2+.18*Math.sin(i),0,a);patch.position.set(Math.cos(a)*1.12,.35*Math.sin(i*2.2),Math.sin(a)*1.12);ball.add(patch)}
const base=new THREE.Mesh(new THREE.CylinderGeometry(1.7,2.15,.34,64),new THREE.MeshStandardMaterial({color:0x07110c,metalness:.8,roughness:.25,emissive:0x062815}));base.position.y=-1.75;scene.add(base);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.78,.045,8,64),new THREE.MeshBasicMaterial({color:0x2cff70}));ring.rotation.x=Math.PI/2;ring.position.y=-1.56;scene.add(ring);
// particles
const count=850,geo=new THREE.BufferGeometry(),pos=new Float32Array(count*3);for(let i=0;i<count;i++){const r=5+Math.random()*12,a=Math.random()*Math.PI*2;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=-1+Math.random()*8;pos[i*3+2]=Math.sin(a)*r-3}geo.setAttribute('position',new THREE.BufferAttribute(pos,3));const stars=new THREE.Points(geo,new THREE.PointsMaterial({color:0x63ff99,size:.028,transparent:true,opacity:.8}));scene.add(stars);
let mx=0,my=0;addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2});
function animate(t=0){requestAnimationFrame(animate);ball.rotation.y+=.006;ball.rotation.x=Math.sin(t*.001)*.08;ball.position.y=.1+Math.sin(t*.002)*.12;stars.rotation.y+=.00045;camera.position.x+=(mx*1.1-camera.position.x)*.025;camera.position.y+=(2.2-my*.55-camera.position.y)*.025;camera.lookAt(0,-.2,0);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('enter').onclick=()=>{document.body.style.transition='opacity .45s';document.body.style.opacity='0';setTimeout(()=>location.href='standings.html',450)};
</script>
</body></html>
