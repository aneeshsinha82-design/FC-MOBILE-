<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FC MOBILE — Standings</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main class="page">
  <section class="standings-panel">
    <div class="panel-title">
      <div class="table-label">Table</div>
      <div class="season"><span>Season</span><strong>2026-27</strong><span class="arrow">▾</span></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th class="pos-head"></th><th class="club-head">Club</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th class="pts-head">Pts</th><th class="last-head">Last 5</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
fetch('data.json?v=3').then(r=>r.json()).then(teams=>{
 teams.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.team.localeCompare(b.team));
 const tb=document.getElementById('tb');
 tb.innerHTML=teams.map((t,i)=>{
   const pos=i+1;
   const zone=pos===1?'champions':pos<=4?'europe':pos>=teams.length-1?'relegation':'neutral';
   const last5=Array.from({length:5},()=>'<span class="form-dot"></span>').join('');
   return `<tr class="${zone}"><td class="position">${pos}</td><td class="club"><span class="club-mark">${t.team.slice(0,2)}</span>${t.team}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gd}</td><td class="points">${t.pts}</td><td class="last5">${last5}</td></tr>`;
 }).join('');
}).catch(()=>document.getElementById('tb').innerHTML='<tr><td colspan="11">Unable to load standings data.</td></tr>');
</script>
</body>
</html>
