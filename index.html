<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FC MOBILE — Home</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030806;font-family:Arial,Helvetica,sans-serif;color:white}
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.shade{position:fixed;inset:0;z-index:1;background:radial-gradient(circle at 50% 43%,transparent 0 18%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.76) 100%);pointer-events:none}
header{position:fixed;z-index:3;top:0;left:0;width:100%;padding:26px clamp(20px,5vw,72px);display:flex;justify-content:space-between;align-items:center}
.brand{font-size:clamp(20px,2.1vw,34px);font-weight:900;font-style:italic;letter-spacing:-1px}.brand b{color:#21e85e}.tag{font-size:10px;letter-spacing:.28em;color:#a8b6ae;margin-top:4px}
.status{font-size:11px;letter-spacing:.15em;color:#dce9e0;border:1px solid rgba(42,237,105,.35);padding:9px 14px;border-radius:999px;background:rgba(4,20,10,.38)}
.hero{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 20px 40px;pointer-events:none}
.kicker{font-size:11px;letter-spacing:.42em;color:#58f58a;margin-bottom:15px;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(46px,9vw,130px);line-height:.88;letter-spacing:-.06em;font-style:italic;text-shadow:0 0 35px rgba(37,241,99,.18)}.hero h1 span{color:#25e965}
.hero p{margin:20px auto 28px;max-width:560px;color:#d0d8d3;font-size:clamp(14px,1.4vw,18px);line-height:1.55}
.cta{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,255,255,.38);background:linear-gradient(135deg,#72777d,#3e4349);color:#f5f5f5;padding:17px 42px;border-radius:12px;font-size:15px;font-weight:900;letter-spacing:.15em;box-shadow:0 0 28px rgba(0,0,0,.42);transition:.25s}.cta:hover{transform:translateY(-3px) scale(1.03);background:linear-gradient(135deg,#8a9096,#50565c)}.hint{margin-top:17px;font-size:10px;letter-spacing:.2em;color:#94a39a;text-transform:uppercase}
footer{position:fixed;z-index:3;bottom:20px;left:0;width:100%;padding:0 clamp(20px,5vw,72px);display:flex;justify-content:space-between;color:#78857d;font-size:10px;letter-spacing:.12em}
@media(max-width:600px){header{padding:20px}.status{display:none}.hero{padding-top:60px}.hero p{max-width:330px}.cta{padding:15px 28px}footer{padding:0 20px}.footer-right{display:none}}

/* GPU-friendly page transition: only transform + opacity are animated */
.transition-layer{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.fly-button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateX(120vw) scale(.92);opacity:0;background:linear-gradient(135deg,#72777d,#3e4349);color:#f5f5f5;padding:17px 42px;border-radius:12px;font-size:15px;font-weight:900;letter-spacing:.15em;white-space:nowrap;box-shadow:0 0 38px rgba(0,0,0,.5);will-change:transform,opacity}
.standings-reveal{position:absolute;left:50%;top:50%;width:min(86vw,860px);height:min(58vh,480px);transform:translate(-50%,-50%) perspective(1100px) rotateX(72deg) scale(.06);transform-origin:center bottom;opacity:0;border-radius:18px;background:rgba(8,18,26,.94);border:1px solid rgba(73,244,128,.48);box-shadow:0 28px 80px rgba(0,0,0,.55),0 0 48px rgba(32,220,90,.2);padding:22px;will-change:transform,opacity}
.reveal-title{color:#58f58a;font-weight:900;letter-spacing:.2em;font-size:15px;margin-bottom:16px}.reveal-row{height:10%;min-height:28px;margin:8px 0;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(32,220,90,.35),rgba(255,255,255,.08))}
body.transitioning header,body.transitioning .hero,body.transitioning footer{animation:contentOut .42s ease forwards}
body.transitioning .fly-button{animation:flyIn .62s cubic-bezier(.2,.8,.2,1) forwards}
body.transitioning .standings-reveal{animation:tableOut .72s cubic-bezier(.16,.84,.3,1) .52s forwards}
body.transitioning .shade{animation:shadeOut 1.15s ease forwards}
@keyframes flyIn{0%{opacity:1;transform:translate(-50%,-50%) translateX(0) scale(1)}45%{opacity:1;transform:translate(-50%,-50%) translateX(58vw) scale(.88)}46%{opacity:0;transform:translate(-50%,-50%) translateX(62vw) scale(.86)}47%{opacity:0;transform:translate(-50%,-50%) translateX(-120vw) scale(.86)}100%{opacity:1;transform:translate(-50%,-50%) translateX(0) scale(1)}}
@keyframes tableOut{0%{opacity:0;transform:translate(-50%,-50%) perspective(1100px) rotateX(72deg) scale(.06)}18%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) perspective(1100px) rotateX(0deg) scale(1)}}
@keyframes contentOut{to{opacity:0;transform:scale(.98)}}@keyframes shadeOut{to{opacity:.45}}
@media(prefers-reduced-motion:reduce){body.transitioning .fly-button,body.transitioning .standings-reveal{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline controlslist="nodownload"><source src="video_2026-08-29_18-55-29.mp4?v=2" type="video/mp4"></video><div class="shade"></div>
<header><div><div class="brand"><b>FC</b> MOBILE</div><div class="tag">FAN STANDINGS HUB</div></div><div class="status">● LIVE SEASON 2026–27</div></header>
<main class="hero">
<div class="kicker">Enter the arena</div>
<h1>THE <span>GAME</span><br>STARTS HERE.</h1>
<p>Explore the latest FC Mobile season standings and follow the competition.</p>
<button class="cta" id="enter">VIEW STANDINGS →</button>
<div class="hint">Enter the standings hub</div>
</main>
<div class="transition-layer" aria-hidden="true"><div class="fly-button">VIEW STANDINGS →</div><div class="standings-reveal"><div class="reveal-title">LEAGUE STANDINGS</div><div class="reveal-row"></div><div class="reveal-row"></div><div class="reveal-row"></div><div class="reveal-row"></div><div class="reveal-row"></div><div class="reveal-row"></div></div></div><footer><div>© 2026 FC MOBILE FAN PROJECT</div><div class="footer-right">WATCH • EXPLORE • COMPETE</div></footer>
<script>
const video=document.querySelector('.bg-video');
video.muted=true;
video.load();
video.play().catch(()=>{});
video.addEventListener('canplay',()=>video.play().catch(()=>{}),{once:true});
document.getElementById('enter').onclick=()=>{
  if(document.body.classList.contains('transitioning')) return;
  document.body.classList.add('transitioning');
  setTimeout(()=>{location.href='standings.html'},1250);
};
</script>
</body></html>
